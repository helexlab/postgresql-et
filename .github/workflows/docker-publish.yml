name: Build and Publish to GHCR

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual trigger from the GitHub UI

# Give the workflow explicit write permission for packages (containers)
permissions:
  contents: read
  packages: write

env:
  # Define the GHCR registry URL
  REGISTRY: ghcr.io
  # Define the image name using the repository owner and name
  IMAGE_NAME: ${{ github.repository }} # Example: your-username/postgresql-et

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Use the built-in GITHUB_TOKEN for password
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            
      - name: Set up QEMU
        # Required for building non-native architectures (e.g., building ARM on an Intel runner)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # CRUCIAL: Specify the platforms to build for
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max          
